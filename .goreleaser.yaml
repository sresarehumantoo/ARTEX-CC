version: 2

project_name: cc-artex

before:
  hooks:
    - go mod tidy
    - bash -c 'cd web && npm ci && npm run build'

builds:
  - main: ./cmd/cc-artex
    binary: cc-artex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.buildDate={{.Date}}
    flags:
      - -trimpath

archives:
  - format_overrides:
      - goos: darwin
        formats:
          - zip
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  github:
    owner: SREsAreHumanToo
    name: cc-artex
  draft: false
  prerelease: auto

nfpms:
  - package_name: cc-artex
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb]
    vendor: SREsAreHumanToo
    maintainer: SREsAreHumanToo <88474954+sresarehumantoo@users.noreply.github.com>
    homepage: https://github.com/SREsAreHumanToo/cc-artex
    description: MCP tool server for autonomous pentesting with Claude Code
    license: MIT
    section: utils
    bindir: /usr/bin

homebrew_casks:
  - repository:
      owner: SREsAreHumanToo
      name: homebrew-tap
    skip_upload: true
    homepage: https://github.com/SREsAreHumanToo/cc-artex
    description: MCP tool server that turns ARTEX into tools Claude Code calls through your existing Claude subscription.
    binaries:
      - cc-artex
