name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "web/**"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "tools/**"
      - "mcpserver/**"
      - "cmd/artex-cc/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "web/**"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "tools/**"
      - "mcpserver/**"
      - "cmd/artex-cc/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Build live demo
        working-directory: web
        run: |
          npm ci
          npm run build:demo
      - name: Add demo to site
        run: |
          mkdir -p site/dist/demo
          cp -R web/dist-demo/. site/dist/demo/
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: ${{ github.event_name == 'pull_request' }}
          args: >-
            --no-progress
            --max-retries 5
            --retry-wait-time 5
            --max-concurrency 8
            --root-dir ${{ github.workspace }}/site/dist
            --remap 'https://github\.com/SREsAreHumanToo/ARTEX-CC/(?:blob|tree)/main/(.*) file://${{ github.workspace }}/$1'
            --exclude '^https://artex-cc\.com'
            --exclude '^https://github\.com/SREsAreHumanToo/ARTEX-CC/edit/'
            --exclude '^https://github\.com/SREsAreHumanToo/ARTEX-CC/compare/'
            --exclude '^https://app\.hackthebox\.com'
            --accept 200,206,429
            'site/dist/**/*.html'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
