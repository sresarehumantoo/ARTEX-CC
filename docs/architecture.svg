<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      text { dominant-baseline: central; }
      .mono { font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace; }
      .sans { font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
      .t1 { fill: #111827; }
      .t2 { fill: #6b7280; }
      .tw { fill: #fff; }
      .pill-1 { fill: #7c3aed; }
      .pill-2 { fill: #6366f1; }
      .pill-3 { fill: #0ea5e9; }
      .pill-4 { fill: #0891b2; }
      .box-claude { fill: url(#gc); stroke: #7c3aed; }
      .box-artex { fill: url(#ga); stroke: #0ea5e9; }
      .cat-box { fill: #f8fafc; stroke: #e2e8f0; }
      .substrate { fill: #f1f5f9; stroke: #cbd5e1; }
      .acc-1 { fill: #7c3aed; }
      .acc-2 { fill: #6366f1; }
      .acc-3 { fill: #3b82f6; }
      .acc-4 { fill: #0ea5e9; }
      .acc-5 { fill: #0891b2; }
      .wire { stroke: #94a3b8; fill: none; }
      .branch { stroke: #cbd5e1; fill: none; }
      .arr-fill { fill: #94a3b8; }
      .mcp-bg { fill: #ffffff; stroke: #e2e8f0; }
      .gn { fill: #0ea5e9; }
      .ge { stroke: #0ea5e9; fill: none; }
      .dispatch-line { stroke: #7c3aed; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes flow-r { to { stroke-dashoffset: 20; } }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.6; } }
      .af { stroke-dasharray: 8 6; animation: flow 0.8s linear infinite; }
      .ar { stroke-dasharray: 6 5; animation: flow-r 1.2s linear infinite; }
      .ap { animation: pulse 3s ease-in-out infinite; }
      .shd { filter: url(#s); }
      @media (prefers-color-scheme: dark) {
        .t1 { fill: #e5e7eb; }
        .t2 { fill: #9ca3af; }
        .box-claude { fill: url(#gcd); stroke: #a78bfa; }
        .box-artex { fill: url(#gad); stroke: #38bdf8; }
        .cat-box { fill: #1e293b; stroke: #334155; }
        .substrate { fill: #0f172a; stroke: #334155; }
        .wire { stroke: #64748b; }
        .branch { stroke: #475569; }
        .arr-fill { fill: #64748b; }
        .mcp-bg { fill: #1f2937; stroke: #374151; }
        .shd { filter: url(#sd); }
        .dispatch-line { stroke: #a78bfa; }
      }
    </style>
    <linearGradient id="gc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#1e1145"/>
    </linearGradient>
    <linearGradient id="gad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c3547"/>
      <stop offset="100%" stop-color="#082f3f"/>
    </linearGradient>
    <filter id="s" x="-5%" y="-3%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="sd" x="-5%" y="-3%" width="110%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Workflow cycle -->
  <g>
    <rect x="252" y="18" width="100" height="34" rx="17" class="pill-1"/>
    <text x="302" y="35" text-anchor="middle" class="mono tw" font-size="12" font-weight="700" letter-spacing="0.5">ORIENT</text>

    <polygon points="358,30 370,35 358,40" class="arr-fill"/>

    <rect x="376" y="18" width="76" height="34" rx="17" class="pill-2"/>
    <text x="414" y="35" text-anchor="middle" class="mono tw" font-size="12" font-weight="700" letter-spacing="0.5">PLAN</text>

    <polygon points="458,30 470,35 458,40" class="arr-fill"/>

    <rect x="476" y="18" width="100" height="34" rx="17" class="pill-3"/>
    <text x="526" y="35" text-anchor="middle" class="mono tw" font-size="12" font-weight="700" letter-spacing="0.5">EXECUTE</text>

    <polygon points="582,30 594,35 582,40" class="arr-fill"/>

    <rect x="600" y="18" width="76" height="34" rx="17" class="pill-4"/>
    <text x="638" y="35" text-anchor="middle" class="mono tw" font-size="12" font-weight="700" letter-spacing="0.5">LOOP</text>

    <path d="M 676,35 Q 698,35 698,55 Q 698,74 676,74 L 272,74 Q 252,74 252,55 L 252,52"
          class="wire ar" stroke-width="1.5"/>
    <polygon points="246,55 252,44 258,55" class="arr-fill"/>
  </g>

  <!-- Claude Code box -->
  <g>
    <rect x="60" y="104" width="255" height="132" rx="14" class="box-claude shd" stroke-width="1.5"/>
    <text x="187" y="140" text-anchor="middle" class="mono t1" font-size="18" font-weight="700">Claude Code</text>
    <text x="187" y="165" text-anchor="middle" class="sans t2" font-size="13" font-style="italic">The Brain</text>
    <text x="187" y="188" text-anchor="middle" class="sans t2" font-size="11">reasoning · planning · judgment</text>
    <text x="187" y="213" text-anchor="middle" class="mono t2" font-size="10" font-weight="500" letter-spacing="0.5">PARALLEL DISPATCH</text>
    <line x1="140" y1="222" x2="234" y2="222" class="dispatch-line" stroke-width="0.7" opacity="0.4"/>
    <line x1="140" y1="226" x2="234" y2="226" class="dispatch-line" stroke-width="0.7" opacity="0.4"/>
    <line x1="140" y1="230" x2="234" y2="230" class="dispatch-line" stroke-width="0.7" opacity="0.4"/>
  </g>

  <!-- MCP connection (3 animated lines) -->
  <g>
    <line x1="315" y1="156" x2="575" y2="156" class="wire af" stroke-width="1.5"/>
    <line x1="315" y1="170" x2="575" y2="170" class="wire af" stroke-width="1.5"/>
    <line x1="315" y1="184" x2="575" y2="184" class="wire af" stroke-width="1.5"/>
    <rect x="412" y="155" width="56" height="24" rx="6" class="mcp-bg" stroke-width="0.8"/>
    <text x="440" y="167" text-anchor="middle" class="mono t1" font-size="13" font-weight="600">MCP</text>
    <text x="440" y="202" text-anchor="middle" class="sans t2" font-size="10">stdio | HTTP</text>
  </g>

  <!-- ARTEX-CC box -->
  <g>
    <rect x="575" y="104" width="255" height="132" rx="14" class="box-artex shd" stroke-width="1.5"/>
    <text x="702" y="140" text-anchor="middle" class="mono t1" font-size="18" font-weight="700">ARTEX-CC</text>
    <text x="702" y="165" text-anchor="middle" class="sans t2" font-size="13" font-style="italic">The Nervous System</text>
    <text x="702" y="188" text-anchor="middle" class="sans t2" font-size="11">65 tools · 10 categories</text>
    <g transform="translate(682,214)" opacity="0.5">
      <line x1="0" y1="0" x2="15" y2="-10" stroke="#0ea5e9" stroke-width="1"/>
      <line x1="0" y1="0" x2="20" y2="6" stroke="#0ea5e9" stroke-width="1"/>
      <line x1="15" y1="-10" x2="20" y2="6" stroke="#0ea5e9" stroke-width="1"/>
      <line x1="0" y1="0" x2="-10" y2="8" stroke="#06b6d4" stroke-width="0.8"/>
      <line x1="20" y1="6" x2="30" y2="-3" stroke="#06b6d4" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#0ea5e9"/>
      <circle cx="15" cy="-10" r="3" fill="#0ea5e9"/>
      <circle cx="20" cy="6" r="3" fill="#0ea5e9"/>
      <circle cx="-10" cy="8" r="2.5" fill="#06b6d4"/>
      <circle cx="30" cy="-3" r="2.5" fill="#06b6d4"/>
    </g>
  </g>

  <!-- Branches from ARTEX-CC to tool categories -->
  <g>
    <line x1="702" y1="236" x2="702" y2="258" class="branch" stroke-width="1.5"/>
    <line x1="128" y1="258" x2="832" y2="258" class="branch" stroke-width="1.5"/>
    <line x1="128" y1="258" x2="128" y2="274" class="branch" stroke-width="1.5"/>
    <line x1="304" y1="258" x2="304" y2="274" class="branch" stroke-width="1.5"/>
    <line x1="480" y1="258" x2="480" y2="274" class="branch" stroke-width="1.5"/>
    <line x1="656" y1="258" x2="656" y2="274" class="branch" stroke-width="1.5"/>
    <line x1="832" y1="258" x2="832" y2="274" class="branch" stroke-width="1.5"/>
  </g>

  <!-- Tool categories -->
  <g>
    <!-- Recon -->
    <rect x="48" y="274" width="160" height="96" rx="10" class="cat-box shd" stroke-width="1"/>
    <rect x="48" y="274" width="160" height="4" rx="2" class="acc-1"/>
    <text x="128" y="300" text-anchor="middle" class="mono t1" font-size="12" font-weight="600">Recon</text>
    <text x="128" y="320" text-anchor="middle" class="sans t2" font-size="11">domains, IPs, services</text>
    <text x="128" y="338" text-anchor="middle" class="sans t2" font-size="11">scope, enrichment</text>

    <!-- Exploration -->
    <rect x="224" y="274" width="160" height="96" rx="10" class="cat-box shd" stroke-width="1"/>
    <rect x="224" y="274" width="160" height="4" rx="2" class="acc-2"/>
    <text x="304" y="300" text-anchor="middle" class="mono t1" font-size="12" font-weight="600">Exploration</text>
    <text x="304" y="320" text-anchor="middle" class="sans t2" font-size="11">graph, intents, goals</text>
    <text x="304" y="338" text-anchor="middle" class="sans t2" font-size="11">facts, hints, constraints</text>

    <!-- Evidence -->
    <rect x="400" y="274" width="160" height="96" rx="10" class="cat-box shd" stroke-width="1"/>
    <rect x="400" y="274" width="160" height="4" rx="2" class="acc-3"/>
    <text x="480" y="300" text-anchor="middle" class="mono t1" font-size="12" font-weight="600">Evidence</text>
    <text x="480" y="320" text-anchor="middle" class="sans t2" font-size="11">findings, credentials</text>
    <text x="480" y="338" text-anchor="middle" class="sans t2" font-size="11">evidence chains</text>

    <!-- Traffic -->
    <rect x="576" y="274" width="160" height="96" rx="10" class="cat-box shd" stroke-width="1"/>
    <rect x="576" y="274" width="160" height="4" rx="2" class="acc-4"/>
    <text x="656" y="300" text-anchor="middle" class="mono t1" font-size="12" font-weight="600">Traffic</text>
    <text x="656" y="320" text-anchor="middle" class="sans t2" font-size="11">MITM proxy, SOCKS5</text>
    <text x="656" y="338" text-anchor="middle" class="sans t2" font-size="11">replay, HAR export</text>

    <!-- Reporting -->
    <rect x="752" y="274" width="160" height="96" rx="10" class="cat-box shd" stroke-width="1"/>
    <rect x="752" y="274" width="160" height="4" rx="2" class="acc-5"/>
    <text x="832" y="300" text-anchor="middle" class="mono t1" font-size="12" font-weight="600">Reporting</text>
    <text x="832" y="320" text-anchor="middle" class="sans t2" font-size="11">coverage, reports</text>
    <text x="832" y="338" text-anchor="middle" class="sans t2" font-size="11">export, activity log</text>
  </g>

  <!-- Connections to substrate -->
  <g>
    <line x1="128" y1="370" x2="128" y2="395" class="branch" stroke-width="1"/>
    <line x1="304" y1="370" x2="304" y2="395" class="branch" stroke-width="1"/>
    <line x1="480" y1="370" x2="480" y2="395" class="branch" stroke-width="1"/>
    <line x1="656" y1="370" x2="656" y2="395" class="branch" stroke-width="1"/>
    <line x1="832" y1="370" x2="832" y2="395" class="branch" stroke-width="1"/>
  </g>

  <!-- State substrate (PostgreSQL + exploration graph) -->
  <g>
    <rect x="48" y="395" width="864" height="85" rx="12" class="substrate shd" stroke-width="1"/>
    <text x="210" y="428" text-anchor="middle" class="mono t1" font-size="15" font-weight="600">PostgreSQL</text>
    <text x="210" y="450" text-anchor="middle" class="sans t2" font-size="11">state substrate</text>
    <text x="210" y="468" text-anchor="middle" class="sans t2" font-size="11">assets · graph · findings · coverage</text>

    <!-- Exploration graph visualization -->
    <g transform="translate(520, 435)" class="ap">
      <line x1="0" y1="0" x2="40" y2="-18" class="ge" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="0" x2="25" y2="15" class="ge" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="0" x2="-20" y2="12" class="ge" stroke-width="0.8" opacity="0.25"/>
      <line x1="0" y1="0" x2="-30" y2="-10" class="ge" stroke-width="0.8" opacity="0.2"/>
      <line x1="40" y1="-18" x2="25" y2="15" class="ge" stroke-width="1" opacity="0.25"/>
      <line x1="40" y1="-18" x2="70" y2="-8" class="ge" stroke-width="1" opacity="0.25"/>
      <line x1="25" y1="15" x2="60" y2="12" class="ge" stroke-width="0.8" opacity="0.2"/>
      <line x1="70" y1="-8" x2="60" y2="12" class="ge" stroke-width="0.8" opacity="0.2"/>
      <line x1="70" y1="-8" x2="95" y2="-15" class="ge" stroke-width="0.8" opacity="0.2"/>
      <line x1="70" y1="-8" x2="90" y2="8" class="ge" stroke-width="0.8" opacity="0.18"/>
      <line x1="90" y1="8" x2="95" y2="-15" class="ge" stroke-width="0.8" opacity="0.15"/>
      <line x1="95" y1="-15" x2="120" y2="-5" class="ge" stroke-width="0.8" opacity="0.15"/>
      <line x1="90" y1="8" x2="115" y2="15" class="ge" stroke-width="0.8" opacity="0.15"/>
      <line x1="120" y1="-5" x2="115" y2="15" class="ge" stroke-width="0.8" opacity="0.12"/>
      <line x1="120" y1="-5" x2="145" y2="0" class="ge" stroke-width="0.8" opacity="0.12"/>
      <line x1="-20" y1="12" x2="-30" y2="-10" class="ge" stroke-width="0.8" opacity="0.15"/>
      <circle cx="0" cy="0" r="4" class="gn" opacity="0.6"/>
      <circle cx="40" cy="-18" r="3.5" class="gn" opacity="0.55"/>
      <circle cx="25" cy="15" r="3" class="gn" opacity="0.5"/>
      <circle cx="-20" cy="12" r="2.5" class="gn" opacity="0.4"/>
      <circle cx="-30" cy="-10" r="2" class="gn" opacity="0.3"/>
      <circle cx="70" cy="-8" r="3" class="gn" opacity="0.5"/>
      <circle cx="60" cy="12" r="3" class="gn" opacity="0.45"/>
      <circle cx="95" cy="-15" r="2.5" class="gn" opacity="0.4"/>
      <circle cx="90" cy="8" r="2.5" class="gn" opacity="0.4"/>
      <circle cx="120" cy="-5" r="2" class="gn" opacity="0.35"/>
      <circle cx="115" cy="15" r="2" class="gn" opacity="0.35"/>
      <circle cx="145" cy="0" r="2" class="gn" opacity="0.3"/>
    </g>
    <text x="650" y="468" text-anchor="middle" class="mono t2" font-size="10" opacity="0.6">exploration graph</text>
  </g>
</svg>
