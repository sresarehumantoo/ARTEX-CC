<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <style>
      .logotype {
        font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
        fill: #1f2937;
      }
      @media (prefers-color-scheme: dark) {
        .logotype { fill: #e5e7eb; }
      }
    </style>
  </defs>

  <g transform="translate(50, 60)">
    <line x1="0" y1="0" x2="30" y2="-20" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="45" y2="10" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="15" y2="22" stroke="#0ea5e9" stroke-width="1.5" opacity="0.5"/>
    <line x1="30" y1="-20" x2="45" y2="10" stroke="#0ea5e9" stroke-width="1.5" opacity="0.35"/>
    <line x1="45" y1="10" x2="15" y2="22" stroke="#0ea5e9" stroke-width="1.5" opacity="0.35"/>
    <line x1="0" y1="0" x2="-15" y2="18" stroke="#06b6d4" stroke-width="1.2" opacity="0.35"/>
    <line x1="30" y1="-20" x2="55" y2="-8" stroke="#06b6d4" stroke-width="1.2" opacity="0.35"/>
    <line x1="45" y1="10" x2="55" y2="-8" stroke="#06b6d4" stroke-width="1.2" opacity="0.25"/>
    <line x1="15" y1="22" x2="-15" y2="18" stroke="#06b6d4" stroke-width="1.2" opacity="0.25"/>

    <circle cx="0" cy="0" r="4.5" fill="#0ea5e9"/>
    <circle cx="30" cy="-20" r="4.5" fill="#0ea5e9"/>
    <circle cx="45" cy="10" r="4.5" fill="#0ea5e9"/>
    <circle cx="15" cy="22" r="4.5" fill="#0ea5e9"/>
    <circle cx="-15" cy="18" r="3.5" fill="#06b6d4"/>
    <circle cx="55" cy="-8" r="3.5" fill="#06b6d4"/>
  </g>

  <text x="140" y="72" class="logotype">cc-artex</text>
</svg>