<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: "JetBrains Mono", "SF Mono", "Cascadia Code", "Fira Code", monospace; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="640"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="880" y1="0" x2="880" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1040" y1="0" x2="1040" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/>
  </g>

  <!-- Exploration graph (left side, decorative) -->
  <g filter="url(#nodeGlow)">
    <!-- Edges -->
    <line x1="120" y1="200" x2="220" y2="140" stroke="#0ea5e9" stroke-width="1.5" opacity="0.35"/>
    <line x1="120" y1="200" x2="200" y2="280" stroke="#0ea5e9" stroke-width="1.5" opacity="0.35"/>
    <line x1="120" y1="200" x2="60" y2="300" stroke="#0ea5e9" stroke-width="1.5" opacity="0.25"/>
    <line x1="220" y1="140" x2="200" y2="280" stroke="#06b6d4" stroke-width="1.2" opacity="0.2"/>
    <line x1="200" y1="280" x2="140" y2="370" stroke="#06b6d4" stroke-width="1.2" opacity="0.2"/>
    <line x1="60" y1="300" x2="140" y2="370" stroke="#06b6d4" stroke-width="1.2" opacity="0.2"/>
    <line x1="220" y1="140" x2="300" y2="100" stroke="#0ea5e9" stroke-width="1.2" opacity="0.2"/>
    <line x1="200" y1="280" x2="300" y2="320" stroke="#0ea5e9" stroke-width="1.2" opacity="0.2"/>
    <line x1="140" y1="370" x2="80" y2="440" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
    <line x1="300" y1="100" x2="340" y2="180" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
    <line x1="300" y1="320" x2="340" y2="180" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>

    <!-- Nodes -->
    <circle cx="120" cy="200" r="6" fill="#0ea5e9"/>
    <circle cx="220" cy="140" r="6" fill="#0ea5e9"/>
    <circle cx="200" cy="280" r="6" fill="#0ea5e9"/>
    <circle cx="60" cy="300" r="5" fill="#06b6d4"/>
    <circle cx="140" cy="370" r="5" fill="#06b6d4"/>
    <circle cx="300" cy="100" r="4" fill="#06b6d4" opacity="0.7"/>
    <circle cx="300" cy="320" r="4" fill="#06b6d4" opacity="0.7"/>
    <circle cx="340" cy="180" r="3.5" fill="#38bdf8" opacity="0.5"/>
    <circle cx="80" cy="440" r="3.5" fill="#38bdf8" opacity="0.5"/>
  </g>

  <!-- Right-side decorative graph -->
  <g filter="url(#nodeGlow)">
    <line x1="1050" y1="150" x2="1140" y2="200" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3"/>
    <line x1="1140" y1="200" x2="1180" y2="310" stroke="#0ea5e9" stroke-width="1.5" opacity="0.25"/>
    <line x1="1050" y1="150" x2="1100" y2="80" stroke="#06b6d4" stroke-width="1.2" opacity="0.2"/>
    <line x1="1180" y1="310" x2="1220" y2="420" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
    <line x1="1140" y1="200" x2="1220" y2="130" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
    <line x1="1050" y1="150" x2="980" y2="220" stroke="#06b6d4" stroke-width="1" opacity="0.15"/>
    <line x1="980" y1="220" x2="1050" y2="340" stroke="#06b6d4" stroke-width="1" opacity="0.12"/>
    <line x1="1050" y1="340" x2="1180" y2="310" stroke="#06b6d4" stroke-width="1" opacity="0.12"/>

    <circle cx="1050" cy="150" r="5" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="1140" cy="200" r="5" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="1180" cy="310" r="4" fill="#06b6d4" opacity="0.6"/>
    <circle cx="1100" cy="80" r="3.5" fill="#06b6d4" opacity="0.5"/>
    <circle cx="1220" cy="420" r="3.5" fill="#38bdf8" opacity="0.4"/>
    <circle cx="1220" cy="130" r="3" fill="#38bdf8" opacity="0.4"/>
    <circle cx="980" cy="220" r="3.5" fill="#38bdf8" opacity="0.4"/>
    <circle cx="1050" cy="340" r="3" fill="#38bdf8" opacity="0.35"/>
  </g>

  <!-- Terminal prompt decoration -->
  <g opacity="0.15">
    <text x="80" y="560" fill="#0ea5e9" font-size="14" font-family="monospace">$</text>
    <text x="100" y="560" fill="#8b949e" font-size="14" font-family="monospace">claude "pentest 10.129.x.x"</text>
    <rect x="348" y="547" width="8" height="16" fill="#0ea5e9" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0;0.6" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Center logo graph (enlarged from logo.svg) -->
  <g transform="translate(540, 220)" filter="url(#nodeGlow)">
    <line x1="0" y1="0" x2="50" y2="-34" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="75" y2="16" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="0" x2="25" y2="36" stroke="#0ea5e9" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="-34" x2="75" y2="16" stroke="#0ea5e9" stroke-width="1.8" opacity="0.4"/>
    <line x1="75" y1="16" x2="25" y2="36" stroke="#0ea5e9" stroke-width="1.8" opacity="0.4"/>
    <line x1="0" y1="0" x2="-25" y2="30" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="50" y1="-34" x2="92" y2="-14" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>
    <line x1="75" y1="16" x2="92" y2="-14" stroke="#06b6d4" stroke-width="1.3" opacity="0.3"/>
    <line x1="25" y1="36" x2="-25" y2="30" stroke="#06b6d4" stroke-width="1.3" opacity="0.3"/>

    <circle cx="0" cy="0" r="7" fill="#0ea5e9"/>
    <circle cx="50" cy="-34" r="7" fill="#0ea5e9"/>
    <circle cx="75" cy="16" r="7" fill="#0ea5e9"/>
    <circle cx="25" cy="36" r="7" fill="#0ea5e9"/>
    <circle cx="-25" cy="30" r="5.5" fill="#06b6d4"/>
    <circle cx="92" cy="-14" r="5.5" fill="#06b6d4"/>
  </g>

  <!-- Project name -->
  <text x="640" y="320" text-anchor="middle" fill="#e6edf3" font-size="72" font-weight="700" letter-spacing="-1">cc-artex</text>

  <!-- Tagline -->
  <text x="640" y="370" text-anchor="middle" fill="#8b949e" font-size="22" font-weight="400">Autonomous pentesting through your Claude subscription</text>

  <!-- Feature highlights -->
  <g fill="#58a6ff" font-size="16" font-weight="400" text-anchor="middle">
    <text x="280" y="470">59 MCP Tools</text>
    <circle cx="395" cy="466" r="2" fill="#30363d"/>
    <text x="510" y="470">Exploration Graph</text>
    <circle cx="635" cy="466" r="2" fill="#30363d"/>
    <text x="760" y="470">Traffic Proxy</text>
    <circle cx="870" cy="466" r="2" fill="#30363d"/>
    <text x="1000" y="470">Evidence Capture</text>
  </g>

  <!-- Thin accent line at bottom -->
  <rect x="440" y="510" width="400" height="1" fill="#0ea5e9" opacity="0.3" rx="0.5"/>
</svg>
