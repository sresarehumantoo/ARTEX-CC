services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccartex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccartex}
      POSTGRES_DB: ${POSTGRES_DB:-ccartex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccartex} -d ${POSTGRES_DB:-ccartex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Set ARTEX_PG on the host to point at an external database
      ARTEX_PG: ${ARTEX_PG:-postgres://${POSTGRES_USER:-ccartex}:${POSTGRES_PASSWORD:-ccartex}@postgres:5432/${POSTGRES_DB:-ccartex}?sslmode=disable}
      ARTEX_GOAL: ${ARTEX_GOAL:-Pentest engagement}
    ports:
      - "127.0.0.1:9400:9400"
      - "127.0.0.1:8788:8788"
    volumes:
      - data:/app/data
      - ${HOME}/.claude:/root/.claude
    restart: unless-stopped

volumes:
  pgdata:
  data:
