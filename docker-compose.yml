services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccartex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccartex}
      POSTGRES_DB: ${POSTGRES_DB:-ccartex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccartex} -d ${POSTGRES_DB:-ccartex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cc-artex:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Set CC_ARTEX_PG on the host to point at an external database
      CC_ARTEX_PG: ${CC_ARTEX_PG:-postgres://ccartex:ccartex@postgres:5432/ccartex?sslmode=disable}
      CC_ARTEX_GOAL: ${CC_ARTEX_GOAL:-Pentest engagement}
    ports:
      - "127.0.0.1:9400:9400"
      - "127.0.0.1:8788:8788"
    volumes:
      - data:/app/data
      - ${HOME}/.claude:/root/.claude
    restart: unless-stopped

volumes:
  pgdata:
  data:
